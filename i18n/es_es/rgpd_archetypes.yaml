# -----------------------------------------------------------------------
# Ayudas de las opciones de enumerados (valueTooltips="true")
# -----------------------------------------------------------------------

archetype.enum_choices.tooltip.dpia-required.tbd: "Todavía no se ha analizado si el tratamiento requiere una evaluación de impacto."
archetype.enum_choices.tooltip.dpia-required.yes: "El tratamiento entraña un alto riesgo (art. 35 RGPD y listas de la AEPD) y requiere una evaluación de impacto."
archetype.enum_choices.tooltip.dpia-required.no: "Analizado el tratamiento, no se requiere una evaluación de impacto."

archetype.enum_choices.tooltip.legal-basis-type.tbd: "Por determinar."
archetype.enum_choices.tooltip.legal-basis-type.consent: "El interesado dio su consentimiento para el tratamiento de sus datos para uno o varios fines específicos."
archetype.enum_choices.tooltip.legal-basis-type.contract: "El tratamiento es necesario para ejecutar un contrato en el que el interesado es parte o para aplicar medidas precontractuales a petición suya."
archetype.enum_choices.tooltip.legal-basis-type.legal-obligation: "El tratamiento es necesario para cumplir una obligación legal aplicable al responsable. Indique la norma habilitante."
archetype.enum_choices.tooltip.legal-basis-type.vital-interests: "El tratamiento es necesario para proteger intereses vitales del interesado o de otra persona física."
archetype.enum_choices.tooltip.legal-basis-type.public-interest: "El tratamiento es necesario para cumplir una misión realizada en interés público o en el ejercicio de poderes públicos. Indique la norma habilitante."
archetype.enum_choices.tooltip.legal-basis-type.legitimate-interest: "El tratamiento es necesario para satisfacer intereses legítimos del responsable o de un tercero que prevalecen sobre los derechos del interesado. No aplicable a las autoridades públicas en el ejercicio de sus funciones."

archetype.enum_choices.tooltip.exception-type.tbd: "Por determinar."
archetype.enum_choices.tooltip.exception-type.art-9-2-a: "El interesado dio su consentimiento explícito para uno o varios fines especificados."
archetype.enum_choices.tooltip.exception-type.art-9-2-b: "Cumplimiento de obligaciones y ejercicio de derechos en el ámbito del derecho laboral y de la seguridad y protección social."
archetype.enum_choices.tooltip.exception-type.art-9-2-c: "Protección de intereses vitales del interesado o de otra persona, si el interesado no puede dar su consentimiento."
archetype.enum_choices.tooltip.exception-type.art-9-2-d: "Actividades legítimas de fundaciones, asociaciones u otros organismos sin ánimo de lucro, referidas a sus miembros."
archetype.enum_choices.tooltip.exception-type.art-9-2-e: "Datos que el interesado ha hecho manifiestamente públicos."
archetype.enum_choices.tooltip.exception-type.art-9-2-f: "Formulación, ejercicio o defensa de reclamaciones, o actuación de los tribunales."
archetype.enum_choices.tooltip.exception-type.art-9-2-g: "Razones de un interés público esencial, sobre la base de una norma con rango de ley."
archetype.enum_choices.tooltip.exception-type.art-9-2-h: "Medicina preventiva o laboral, evaluación de la capacidad laboral, diagnóstico médico o asistencia sanitaria o social."
archetype.enum_choices.tooltip.exception-type.art-9-2-i: "Razones de interés público en el ámbito de la salud pública."
archetype.enum_choices.tooltip.exception-type.art-9-2-j: "Fines de archivo en interés público, de investigación científica o histórica o estadísticos."

archetype.enum_choices.tooltip.safeguard.tbd: "Por determinar."
archetype.enum_choices.tooltip.safeguard.adequacy-decision: "La Comisión Europea ha decidido que el país garantiza un nivel de protección adecuado."
archetype.enum_choices.tooltip.safeguard.standard-contractual-clauses: "El contrato con el importador de los datos incluye las cláusulas contractuales tipo aprobadas por la Comisión Europea."
archetype.enum_choices.tooltip.safeguard.binding-corporate-rules: "El grupo empresarial dispone de normas corporativas vinculantes aprobadas por una autoridad de control."
archetype.enum_choices.tooltip.safeguard.art-49-derogation: "Excepción para situaciones específicas, como el consentimiento explícito del interesado o la ejecución de un contrato. Documente la excepción aplicada."

archetype.enum_choices.tooltip.data-type.tbd: "Por determinar."
archetype.enum_choices.tooltip.data-type.identifying: "Nombre, apellidos, DNI o NIE, firma, imagen, voz..."
archetype.enum_choices.tooltip.data-type.contact: "Dirección postal, teléfono, correo electrónico..."
archetype.enum_choices.tooltip.data-type.economic: "Datos bancarios, ingresos, nóminas, seguros..."
archetype.enum_choices.tooltip.data-type.professional: "Formación, titulaciones, experiencia profesional, puesto de trabajo..."
archetype.enum_choices.tooltip.data-type.personal-characteristics: "Fecha de nacimiento, sexo, nacionalidad, estado civil..."
archetype.enum_choices.tooltip.data-type.social-circumstances: "Vivienda, aficiones, pertenencia a asociaciones..."
archetype.enum_choices.tooltip.data-type.special-category: "Origen étnico, opiniones políticas, convicciones religiosas, afiliación sindical, datos genéticos, biométricos, de salud o sobre la vida u orientación sexual. Requiere una excepción del art. 9.2."
archetype.enum_choices.tooltip.data-type.criminal-offences: "Datos relativos a condenas e infracciones penales (art. 10 RGPD)."

archetype.enum_choices.tooltip.recipient-type.tbd: "Por determinar."
archetype.enum_choices.tooltip.recipient-type.processor: "Trata datos por cuenta del responsable. Requiere un contrato de encargo (art. 28 RGPD)."
archetype.enum_choices.tooltip.recipient-type.joint-controller: "Determina conjuntamente con el responsable los fines y medios del tratamiento (art. 26 RGPD)."
archetype.enum_choices.tooltip.recipient-type.third-party: "Recibe los datos para sus propios fines (cesión o comunicación de datos)."
archetype.enum_choices.tooltip.recipient-type.public-authority: "Administraciones, juzgados y tribunales u otras autoridades que reciben los datos por obligación legal."

