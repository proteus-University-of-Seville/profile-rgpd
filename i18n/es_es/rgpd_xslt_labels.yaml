# Ayuda de las vistas (solo se muestra dentro de PROTEUS)
xslt.rgpd.view_help_title: "Para qué sirve esta vista."
xslt.rgpd.inventory_help: "Genera el inventario de actividades de tratamiento que las administraciones y entidades públicas deben publicar en su web (art. 31.2 LOPDGDD). Incluye solo las actividades vigentes y la información del art. 30 RGPD; omite riesgos, evaluaciones de impacto y otros datos internos."
xslt.rgpd.clauses_help: "Genera la información básica que hay que dar a los interesados al recoger sus datos (arts. 13 y 14 RGPD), según el modelo de información por capas de la AEPD. Hay una cláusula por actividad vigente: copie cada una en el formulario, contrato o cartel donde se recojan esos datos."
